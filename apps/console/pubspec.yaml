name: mona_console
description: Mona Menu partner console - restaurants manage orders, menus, posts and settings.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  animated_text_kit: ^4.3.0
  bot_toast: ^4.1.3
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  cupertino_icons: ^2.0.0
  day_night_time_picker: ^1.3.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_storage: ^14.0.1
  flutter_easyloading: ^4.0.2
  flutter_multi_formatter: ^2.13.11
  flutter_svg: ^2.3.2
  get: ^4.7.3
  http: ^1.6.0
  image_cropper: ^13.0.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  modal_bottom_sheet: ^3.0.0
  permission_handler: ^13.0.2
  reactive_forms: ^18.2.2
  reorderables: ^0.6.0
  scrollable_positioned_list: ^0.3.8
  shimmer: ^4.0.0
  timeago: ^3.7.1
  toggle_switch: ^2.3.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

# `dart run flutter_launcher_icons` regenerates the launcher icons.
flutter_launcher_icons:
  android: false
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/mona_console_logo.png

# `dart run flutter_native_splash:create` regenerates the splash screen.
flutter_native_splash:
  color: '#b72621'
  image: assets/images/mona_m_transparent_l.png
  branding: assets/images/mona_menu_text_logo.png
  branding_mode: bottom
  ios: true
  android: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/noto_sans_jp/NotoSansJP-Regular.otf
        - asset: assets/fonts/noto_sans_jp/NotoSansJP-Black.otf
          weight: 900
        - asset: assets/fonts/noto_sans_jp/NotoSansJP-Bold.otf
          weight: 700
        - asset: assets/fonts/noto_sans_jp/NotoSansJP-Medium.otf
          weight: 500
        - asset: assets/fonts/noto_sans_jp/NotoSansJP-Thin.otf
          weight: 300
