name: mona_diner
description: Mona Menu diner app - browse dish posts, order at a restaurant and pay with Stripe.
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.9.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  algoliasearch: ^1.55.0
  badges: ^4.0.1
  circular_countdown: ^2.1.0
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  cupertino_icons: ^2.0.0
  easy_localization: ^3.0.8
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_storage: ^14.0.1
  flutter_easyloading: ^4.0.2
  flutter_multi_formatter: ^2.13.11
  flutter_stripe: ^14.2.0
  flutter_svg: ^2.3.2
  get: ^4.7.3
  google_maps_flutter: ^2.19.0
  image_cropper: ^13.0.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  intl_phone_number_input: ^0.7.5
  modal_bottom_sheet: ^3.0.0
  package_info_plus: ^10.2.2
  pay: ^4.0.0
  permission_handler: ^13.0.2
  persistent_bottom_nav_bar: ^6.2.1
  # 10.x needs the app migrated to package:material_ui; 9.x works with
  # package:flutter/material.dart.
  pin_code_fields: ^9.5.1
  reactive_forms: ^18.2.2
  share_plus: ^13.3.1
  shimmer: ^4.0.0
  tab_indicator_styler: ^2.0.0
  timeago: ^3.7.1
  toggle_switch: ^2.3.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

# `dart run flutter_launcher_icons` regenerates the launcher icons.
flutter_launcher_icons:
  android: launcher_icon
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/mona_menu_launch_icon.png
  image_path_android: assets/icons/mona_android_icon.png
  adaptive_icon_background: '#ffffff'
  adaptive_icon_foreground: assets/icons/mona_android_icon.png

# `dart run flutter_native_splash:create` regenerates the splash screen.
flutter_native_splash:
  color: '#6F35A5'
  image: assets/images/mona_m_l.png
  branding: assets/images/web_splash@0.5x.png
  branding_mode: bottom
  ios: true
  android: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/map_style/
    - assets/translations/

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/noto_sans_jp/NotoSansJP-Regular.otf
        - asset: assets/fonts/noto_sans_jp/NotoSansJP-Black.otf
          weight: 900
        - asset: assets/fonts/noto_sans_jp/NotoSansJP-Bold.otf
          weight: 700
        - asset: assets/fonts/noto_sans_jp/NotoSansJP-Medium.otf
          weight: 500
        - asset: assets/fonts/noto_sans_jp/NotoSansJP-Thin.otf
          weight: 300
